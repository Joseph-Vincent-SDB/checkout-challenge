<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<title>Checkout Challenge</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#111111">
<meta name="color-scheme" content="light">
<meta name="description" content="Checkout Challenge: volunteer app for the UNSW E-Commerce Society stall.">
<meta name="robots" content="noindex, nofollow">
<meta property="og:type" content="website">
<meta property="og:title" content="Checkout Challenge (EcomSoc volunteers)">
<meta property="og:description" content="Volunteers: open this in Safari or Chrome (not inside Instagram), then Add to Home Screen.">
<meta property="og:image" content="https://joseph-vincent-sdb.github.io/checkout-challenge/icons/icon-512.png">
<meta name="twitter:card" content="summary">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Checkout">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/favicon.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>
/* ============================================================
   THEME: change colours here. Light, high contrast, for sunlight.
   ============================================================ */
:root{
  --bg:#FFFBF0;
  --card:#FFFFFF;
  --ink:#111111;
  --ink2:#3A3A3A;
  --gold:#F5B800;
  --gold-soft:#FFEFB8;
  --hot:#C8001E;
  --full:#E4E0D3;
  --ok:#0A6B34;
  --ok-soft:#DDF3E4;
  --bad:#8B1A1A;
  --bad-soft:#FBE4E4;
  --warn:#FFB000;
  --safe-t:env(safe-area-inset-top,0px);
  --safe-b:env(safe-area-inset-bottom,0px);
  --safe-l:env(safe-area-inset-left,0px);
  --safe-r:env(safe-area-inset-right,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);overscroll-behavior:none;overflow:hidden}
body{
  font:500 18px/1.35 system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  -webkit-text-size-adjust:100%;text-size-adjust:100%;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;
}
input,textarea{-webkit-user-select:text;user-select:text}
button{font:inherit;color:inherit;touch-action:manipulation;-webkit-user-select:none;user-select:none;cursor:pointer}
svg.i{width:1.2em;height:1.2em;flex:none;vertical-align:-0.2em}
#app{
  height:100vh;height:100dvh;display:flex;flex-direction:column;
  padding-left:var(--safe-l);padding-right:var(--safe-r);
  max-width:560px;margin:0 auto;
}
.main{flex:1 1 auto;min-height:0;overflow-y:auto;overscroll-behavior:contain;padding:8px 16px 8px;display:flex;flex-direction:column;gap:12px}
.foot{flex:none;padding:8px 16px max(14px,var(--safe-b));display:flex;flex-direction:column;gap:10px}

/* top bar */
.bar{flex:none;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;padding:max(8px,var(--safe-t)) 12px 6px}
.bar .mid{font-weight:800;font-size:16px;text-transform:uppercase;letter-spacing:.04em;text-align:center;color:var(--ink2)}
.barbtn{min-height:48px;min-width:48px;padding:6px 12px;border:2px solid var(--ink);border-radius:12px;background:#fff;font-weight:800;font-size:17px;display:inline-flex;align-items:center;gap:6px;justify-self:start}
.barbtn.r{justify-self:end}
.barbtn:active{background:var(--gold-soft)}
.steps{flex:none;display:grid;grid-template-columns:repeat(5,1fr);gap:6px;padding:0 16px}
.steps i{height:7px;border-radius:4px;background:#D9D4C4}
.steps i.on{background:var(--ink)}
.steps i.done{background:var(--gold)}

/* buttons */
.btn{display:flex;align-items:center;justify-content:center;gap:10px;min-height:56px;width:100%;padding:12px 18px;border:3px solid var(--ink);border-radius:16px;background:#fff;color:var(--ink);font-weight:800;font-size:20px;line-height:1.1;text-align:center;box-shadow:0 4px 0 var(--ink);transition:transform .06s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.btn.pri{background:var(--gold)}
.btn.big{min-height:88px;font-size:28px;border-radius:20px}
.btn.sm{min-height:48px;font-size:18px;box-shadow:0 3px 0 var(--ink)}
.btn.ok{background:var(--ok);color:#fff;border-color:var(--ok);box-shadow:0 4px 0 #06431f}
.btn[disabled]{opacity:.45;pointer-events:none}
.row{display:flex;gap:10px}
.row>*{flex:1}
.txtbtn{min-height:48px;background:none;border:0;font-weight:800;font-size:18px;text-decoration:underline;text-underline-offset:4px;padding:8px 12px}

/* common bits */
h1,h2,h3,p{margin:0}
.title{font-weight:900;font-size:30px;line-height:1.05;letter-spacing:-.01em}
.sub{color:var(--ink2);font-size:18px}
.pill{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:99px;border:2px solid var(--ink);background:#fff;font-weight:700;font-size:14px;line-height:1.2}
.pill.good{background:var(--ok-soft);border-color:var(--ok);color:#064d24}
.pill.warn{background:var(--gold-soft)}
.card{background:var(--card);border:3px solid var(--ink);border-radius:18px;padding:14px}

/* home */
.brand{display:flex;align-items:center;gap:12px;padding:max(10px,var(--safe-t)) 16px 0}
.brand img{width:52px;height:52px;border-radius:50%;border:2px solid var(--ink);display:block;background:#FAF8F2}
.brand b{display:block;font-size:22px;font-weight:900;line-height:1.05}
.brand span{font-size:14px;color:var(--ink2);font-weight:600}
.stock{border:3px solid var(--ink);border-radius:20px;padding:12px 16px;background:var(--gold-soft);display:flex;align-items:center;gap:14px}
.stock .n{font-size:56px;font-weight:900;line-height:1;min-width:2ch;font-variant-numeric:tabular-nums}
.stock .l{font-weight:800;font-size:18px;line-height:1.15}
.stock .l small{display:block;font-weight:600;font-size:15px;color:var(--ink2)}
.stock.low{background:var(--warn)}
.stock.out{background:var(--ink);color:#fff}
.stock.out .l small{color:#ddd}
.tallies{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.tally{border:2px solid var(--ink);border-radius:14px;background:#fff;text-align:center;padding:6px 2px}
.tally b{display:block;font-size:26px;line-height:1.1;font-weight:900;font-variant-numeric:tabular-nums}
.tally span{font-size:13px;font-weight:700;color:var(--ink2)}
.pills{display:flex;flex-wrap:wrap;gap:6px}
.banner-warn{background:var(--bad-soft);border:2px solid var(--bad);border-radius:12px;padding:8px 12px;font-size:15px;font-weight:600;color:#5a0f0f}
.spacer{flex:1 1 auto}
.iabbar{display:block;width:100%;min-height:48px;text-align:left;font-weight:700;font-size:15px;line-height:1.25;cursor:pointer}

/* follow */
.qrcard{align-self:center;background:#fff;border:3px solid var(--ink);border-radius:18px;padding:8px;line-height:0}
.qrcard svg{display:block}
.handle{font-size:clamp(26px,8vw,34px);font-weight:900;text-align:center;letter-spacing:-.01em;word-break:break-all}
.center{text-align:center}

/* deal tags */
.deal{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:8px 14px;border-radius:14px;font-weight:900;font-size:20px;line-height:1.1;border:3px solid var(--ink)}
.deal.hot{background:var(--hot);color:#fff;border-color:#7d0012}
.deal.hot s{opacity:.95;font-weight:700;text-decoration-thickness:3px}
.deal .off{background:var(--gold);color:var(--ink);border-radius:8px;padding:2px 8px;font-size:18px}
.deal.full{background:var(--full);color:var(--ink);border-style:dashed}
.deal.full small{font-weight:700;font-size:16px;color:var(--ink2)}
.deal .lbl{display:inline-flex;align-items:center;gap:6px;letter-spacing:.02em}
.deal.pop{animation:pop .32s cubic-bezier(.2,1.5,.4,1)}
@keyframes pop{from{transform:scale(.7) rotate(-3deg);opacity:0}to{transform:none;opacity:1}}

/* reveal + drop */
.mystery{align-self:center;width:min(78%,290px);aspect-ratio:1/1;border:4px dashed var(--ink);border-radius:28px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;background:#fff;transform:rotate(-2deg)}
.mystery b{font-size:76px;line-height:1;font-weight:900}
.mystery span{font-weight:800;font-size:18px}
.scanbox{position:relative;align-self:center;width:min(86%,320px);height:150px;border:3px solid var(--ink);border-radius:18px;background:#fff;overflow:hidden;animation:scanfade .01s linear .46s forwards}
.scanbox .bc{position:absolute;inset:18px 22px;background:repeating-linear-gradient(90deg,#111 0 4px,#fff 4px 7px,#111 7px 9px,#fff 9px 14px,#111 14px 20px,#fff 20px 23px)}
.scanbox .ln{position:absolute;left:0;right:0;height:5px;background:var(--hot);box-shadow:0 0 12px 3px rgba(200,0,30,.55);top:6%;animation:scan .42s ease-in-out both}
@keyframes scan{0%{top:6%}50%{top:90%}100%{top:6%}}
@keyframes scanfade{to{opacity:0;height:0;margin:-6px 0;border-width:0}}
.bigtag{align-self:center;width:min(92%,340px);border-radius:24px;padding:22px 18px;text-align:center;border:4px solid var(--ink);animation:stamp .34s cubic-bezier(.2,1.6,.4,1) .45s both}
.bigtag .t1{font-size:clamp(38px,12vw,52px);font-weight:900;line-height:1;letter-spacing:.01em}
.bigtag .t2{margin-top:10px;font-size:30px;font-weight:800;display:flex;justify-content:center;align-items:center;gap:12px;flex-wrap:wrap}
.bigtag .t3{margin-top:6px;font-size:20px;font-weight:700}
.bigtag.hot{background:var(--hot);color:#fff;border-color:#7d0012}
.bigtag.hot .off{background:var(--gold);color:var(--ink);border-radius:10px;padding:2px 12px}
.bigtag.hot s{text-decoration-thickness:4px}
.bigtag.full{background:var(--full);border-style:dashed}
@keyframes stamp{0%{transform:scale(1.7) rotate(-8deg);opacity:0}100%{transform:none;opacity:1}}
.scanmsg{text-align:center;font-weight:800;color:var(--ink2)}
.dropwrap{flex:1;display:flex;flex-direction:column;justify-content:center;gap:18px}
.dropwrap.nomo .scanbox{display:none}
.dropwrap.nomo .bigtag{animation:none}

/* question */
.qwrap{flex:1 1 auto;display:flex;flex-direction:column;justify-content:space-between;gap:10px;min-height:0}
.qtext{font-size:clamp(26px,7.4vw,32px);font-weight:900;line-height:1.14;letter-spacing:-.01em}
.qtext.long{font-size:26px}
.answers{display:flex;flex-direction:column;gap:8px}
.ans{display:flex;align-items:center;gap:12px;min-height:56px;width:100%;padding:8px 12px;border:3px solid var(--ink);border-radius:16px;background:#fff;text-align:left;box-shadow:0 3px 0 var(--ink);font-weight:700}
.ans:active{transform:translateY(2px);box-shadow:0 1px 0 var(--ink);background:var(--gold-soft)}
.ans .ltr{flex:none;width:40px;height:40px;border-radius:12px;background:var(--ink);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:22px}
.ans .txt{font-size:20px;line-height:1.15;flex:1;min-width:0;overflow-wrap:anywhere}
.ans .tag{flex:none;display:inline-flex;align-items:center;gap:4px;font-size:15px;font-weight:800}
.ans.is-right{background:var(--ok);border-color:var(--ok);color:#fff;box-shadow:0 3px 0 #06431f}
.ans.is-right .ltr{background:#fff;color:var(--ok)}
.ans.is-wrong{background:var(--bad-soft);border-color:var(--bad);color:#4a0c0c;box-shadow:0 3px 0 var(--bad)}
.ans.is-wrong .ltr{background:var(--bad)}
.ans.dim{opacity:.6;box-shadow:none}
.answers.done .ans{pointer-events:none;min-height:48px;padding-top:4px;padding-bottom:4px}
.qtext.small{font-size:19px;line-height:1.2}

/* result */
.banner{display:flex;align-items:center;gap:12px;border-radius:18px;padding:12px 14px;border:3px solid var(--ink)}
.banner svg.i{width:40px;height:40px}
.banner b{display:block;font-size:26px;line-height:1.05;font-weight:900;letter-spacing:.01em}
.banner small{display:block;font-size:16px;font-weight:700;margin-top:2px}
.banner.ok{background:var(--ok);color:#fff;border-color:#06431f}
.banner.bad{background:var(--bad-soft);color:#4a0c0c;border-color:var(--bad)}
.fact{background:var(--gold-soft);border:3px solid var(--ink);border-radius:16px;padding:10px 14px}
.fact small{display:block;font-weight:900;font-size:14px;text-transform:uppercase;letter-spacing:.06em}
.fact p{font-size:19px;font-weight:600;margin-top:2px}
.confetti{position:fixed;left:0;right:0;top:0;height:0;pointer-events:none;z-index:5}
.confetti i{position:absolute;top:0;left:50%;width:10px;height:16px;border-radius:2px;opacity:0;animation:fall 1.3s ease-out forwards}
@keyframes fall{0%{opacity:1;transform:translate(0,0) rotate(0)}100%{opacity:0;transform:translate(var(--x),var(--y)) rotate(var(--r))}}

/* summary + help */
.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.stat{border:2px solid var(--ink);border-radius:14px;background:#fff;padding:8px 12px}
.stat b{display:block;font-size:28px;font-weight:900;line-height:1.1;font-variant-numeric:tabular-nums}
.stat span{font-size:15px;font-weight:700;color:var(--ink2)}
.stat.hot b{color:var(--hot)}
.kv{display:flex;justify-content:space-between;gap:12px;font-weight:700;padding:4px 0;border-bottom:1px dashed #bbb}
.kv:last-child{border:0}
.stepper{display:flex;align-items:center;gap:10px}
.stepper .v{flex:1;text-align:center;font-weight:900;font-size:28px;font-variant-numeric:tabular-nums}
.stepper .btn{width:64px;min-height:52px;padding:6px}
h2.sec{font-size:20px;font-weight:900;margin-top:6px}
input.txt{width:100%;min-height:52px;border:3px solid var(--ink);border-radius:14px;padding:8px 12px;font:700 20px/1.2 inherit;background:#fff;color:var(--ink)}
.hold{position:relative;overflow:hidden;background:#fff;color:var(--bad);border-color:var(--bad);box-shadow:0 4px 0 var(--bad);touch-action:none}
.hold .fill{position:absolute;left:0;top:0;bottom:0;width:0;background:var(--bad-soft)}
.hold.go .fill{width:100%;transition:width 2s linear}
.hold span{position:relative;display:flex;gap:10px;align-items:center}
ol.how{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:10px;counter-reset:s}
ol.how li{counter-increment:s;display:flex;gap:12px;align-items:flex-start;font-size:18px;font-weight:600}
ol.how li::before{content:counter(s);flex:none;width:34px;height:34px;border-radius:50%;background:var(--ink);color:var(--gold);font-weight:900;font-size:19px;display:flex;align-items:center;justify-content:center;margin-top:1px}
ol.how b{font-weight:900}
.tip{background:var(--gold-soft);border:2px solid var(--ink);border-radius:14px;padding:10px 12px;font-size:16px;font-weight:600}

/* modal + toast */
.scrim{position:fixed;inset:0;background:rgba(17,17,17,.6);display:flex;align-items:flex-end;justify-content:center;z-index:20}
.sheet{width:100%;max-width:560px;background:var(--bg);border:3px solid var(--ink);border-bottom:0;border-radius:22px 22px 0 0;padding:18px 16px max(16px,var(--safe-b));display:flex;flex-direction:column;gap:12px}
.sheet h3{font-size:24px;font-weight:900}
.sheet textarea{width:100%;height:180px;font:600 16px/1.3 ui-monospace,Menlo,monospace;border:2px solid var(--ink);border-radius:12px;padding:8px}
.toast{position:fixed;left:50%;bottom:calc(96px + var(--safe-b));transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 18px;border-radius:99px;font-weight:800;font-size:18px;z-index:30;max-width:90vw;text-align:center}


/* sharing status */
.syncrow{display:flex;align-items:center;gap:12px;width:100%;min-height:56px;padding:8px 14px;border:3px solid var(--ink);border-radius:16px;background:#fff;text-align:left;font-weight:800;font-size:17px;line-height:1.15}
.syncrow small{display:block;font-weight:600;font-size:14px;color:var(--ink2);margin-top:1px}
.syncrow .dot{flex:none;width:16px;height:16px;border-radius:50%;background:#999;border:2px solid var(--ink)}
.syncrow.ok{background:var(--ok-soft);border-color:var(--ok)}
.syncrow.ok .dot{background:var(--ok)}
.syncrow.warn{background:var(--gold-soft)}
.syncrow.warn .dot{background:var(--warn)}
.syncrow.bad{background:var(--bad-soft);border-color:var(--bad)}
.syncrow.bad .dot{background:var(--bad)}
.syncrow:active{filter:brightness(.96)}
.kv .r{text-align:right}
small.muted{font-weight:600;font-size:14px;color:var(--ink2)}

@media (max-height:600px){
  .bar{padding-top:max(4px,var(--safe-t));padding-bottom:4px}
  .ans{min-height:52px;padding-top:5px;padding-bottom:5px}
  .ans .ltr{width:36px;height:36px}
  .deal{padding:5px 12px}
  .qtext{line-height:1.1}
  .qwrap{gap:6px}
  .btn.big{min-height:72px}
  .main{gap:8px}
  .mystery{width:min(60%,220px)}
  .mystery b{font-size:56px}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.001s!important;animation-delay:0s!important;transition:none!important}
  .confetti{display:none}
}
noscript{display:block;padding:24px;font-weight:700}
</style>
</head>

<script>
(function () {
'use strict';

/* ============================================================
   SETTINGS: edit these. See README.md.

async function writeMeta(epoch, stock) {

function changeStart(delta) {
  var cur0 = net.metaWant === null ? S.startStock : net.metaWant;
  var want = Math.max(0, Math.min(5000, cur0 + delta));
  net.metaWant = want; S.startStock = want; save(); liveUpdate();
  if (!syncOn()) { net.metaWant = null; return; }
  net.metaPending = true; clearTimeout(net.metaTimer); net.metaTimer = setTimeout(flushMeta, 400);
}
/* sends the latest wanted total, one write at a time, so a slow reply can never overwrite a newer tap */
async function flushMeta() {
  if (net.metaBusy) { net.metaTimer = setTimeout(flushMeta, 250); return; }
  net.metaBusy = true;
  try {
    while (net.metaWant !== null) {
      var w = net.metaWant;
      await writeMeta(S.epoch, w);
      if (net.metaWant === w) net.metaWant = null;
    }
    net.metaPending = false;
  } catch (e) { net.metaWant = null; net.metaPending = false; toast('No internet: shared total not changed'); net.nextPoll = 0; }
  finally { net.metaBusy = false; }
  liveUpdate(); wakeSync();
}
async function resetAll() {
  if (!syncOn()) { localReset(); return; }
  var ep = 'e' + Date.now().toString(36) + newId().slice(0, 3);
  try { await writeMeta(ep, S.startStock); adoptEpoch(ep, true); toast('All phones reset'); go('home'); wakeSync(); }
  catch (e) { toast('No internet: nothing was reset'); }
}

/* ---------- wake lock ---------- */
var wl = null, wakeState = 'off';
function wakeLabel() { return wakeState === 'on' ? 'Screen stays on' : 'Screen may sleep'; }
function wakeUpdate() { var el = $('#wake'); if (el) { el.className = 'pill ' + (wakeState === 'on' ? 'good' : 'warn'); el.innerHTML = ico('sun') + esc(wakeLabel()); } }
async function acquireWake() {
  try {
    if (!('wakeLock' in navigator)) { wakeState = 'off'; wakeUpdate(); return; }
    if (document.visibilityState !== 'visible') return;
    wl = await navigator.wakeLock.request('screen');
    wakeState = 'on';
    wl.addEventListener('release', function () { wl = null; wakeState = 'off'; wakeUpdate(); });
  } catch (e) { wl = null; wakeState = 'off'; }

}
document.addEventListener('pointerdown', function () { if (!wl) acquireWake(); }, { passive: true });

/* ---------- in-app browsers (Instagram, Facebook, TikTok ...) ----------
   Links tapped inside a chat usually open in the app's own built-in browser. It has its own separate storage,
   no offline support and no Add to Home Screen, so volunteers must move to Safari or Chrome first. */
function detectIab(ua) {
  ua = ua || (navigator.userAgent || '');
  var m = ua.match(/Instagram|FBAN|FBAV|FB_IAB|FBIOS|MessengerForiOS|Messenger|TikTok|musical_ly|BytedanceWebview|Snapchat|LinkedInApp|MicroMessenger|KAKAOTALK|Line\/|Twitter/i);
  if (!m) return null;
  var k = m[0].toLowerCase();
  var name = /instagram/.test(k) ? 'Instagram' : /fb|messenger/.test(k) ? 'Facebook or Messenger' : /tiktok|musical|bytedance/.test(k) ? 'TikTok' : /snapchat/.test(k) ? 'Snapchat'
    : /linkedin/.test(k) ? 'LinkedIn' : /micromessenger/.test(k) ? 'WeChat' : /kakao/.test(k) ? 'KakaoTalk' : /line/.test(k) ? 'LINE' : 'X (Twitter)';
  return { name: name, os: /iPhone|iPad|iPod/.test(ua) ? 'ios' : /Android/.test(ua) ? 'android' : 'other' };
}
var IAB = detectIab(), IABKEY = 'ecomsoc-iab-ack', iabAck = false, pendingCode = '';
try { iabAck = localStorage.getItem(IABKEY) === '1'; } catch (e) {}
function iabBlocking() { return !!IAB && !iabAck; }
/* Best-effort handoff from the in-app browser to the phone's default browser. These URL schemes are not
   official, so it may not work in every app or OS version: the guide screen stays as the fallback.
   iPhone: x-safari-https://...   Android: intent://...#Intent;scheme=https;...;end (no package, so the default browser is used) */
function buildHandoff(os, base) {
  var m = String(base).match(/^(https?):\/\/(.*)$/i); if (!m) return '';
  var sch = m[1].toLowerCase();
  if (os === 'ios') return 'x-safari-' + sch + '://' + m[2];
  if (os === 'android') return 'intent://' + m[2] + '#Intent;scheme=' + sch + ';S.browser_fallback_url=' + encodeURIComponent(base) + ';end';
  return '';
}
function iabBase() { var c = pendingCode || S.team; return location.origin + location.pathname + (c ? '#t=' + c : ''); }
function iabNavigate(url, how) {
  try { if (typeof window.__ccNavigate === 'function') { window.__ccNavigate(url, how); return; } } catch (e) {}      // test hook
  try {
    if (how === 'frame') {                     // hidden frame: if the app does not understand the link, nothing visible happens
      var f = document.createElement('iframe'); f.style.cssText = 'position:absolute;width:0;height:0;border:0;visibility:hidden'; f.setAttribute('aria-hidden', 'true');
      f.src = url; document.body.appendChild(f); setTimeout(function () { try { f.remove(); } catch (e) {} }, 4000);
    } else { location.href = url; }
  } catch (e) {}
}
function iabHandoff(auto) {
  if (!IAB) return;
  var u = buildHandoff(IAB.os, iabBase()); if (!u) return;
  iabNavigate(u, auto && IAB.os === 'android' ? 'frame' : 'main');
}
function iabAutoTry() {                        // once per tab session, only in Instagram and Facebook (where this is known to be used)
  if (!iabBlocking() || !/^(Instagram|Facebook)/.test(IAB.name)) return;
  var done = false;
  try { done = sessionStorage.getItem('ecomsoc-iab-tried') === '1'; sessionStorage.setItem('ecomsoc-iab-tried', '1'); } catch (e) {}
  if (done) return;
  setTimeout(function () { if (iabBlocking()) iabHandoff(true); }, 350);
}

/* ---------- QR ---------- */
function qrSvg(px, text, id) {
  try {
    var q = qrcode(0, 'M'); q.addData(text || PROFILE_URL); q.make();
    var n = q.getModuleCount(), m = 4, tot = n + 2 * m, cell = Math.max(3, Math.floor(px / tot)), d = '';
    for (var r = 0; r < n; r++) for (var c = 0; c < n; c++) if (q.isDark(r, c)) d += 'M' + (c + m) + ' ' + (r + m) + 'h1v1h-1z';
    var size = cell * tot;
    return '<svg id="' + (id || 'qr') + '" width="' + size + '" height="' + size + '" viewBox="0 0 ' + tot + ' ' + tot + '" shape-rendering="crispEdges" role="img" aria-label="QR code"><rect width="' + tot + '" height="' + tot + '" fill="#fff"/><path d="' + d + '" fill="#000"/></svg>';
  } catch (e) {
    return '<div style="padding:24px;line-height:1.3;font-weight:700">QR code unavailable.</div>';
  }
}

function syncParts() {

/* ---------- render ---------- */
function render() {
  clearTimeout(dropTimer);
  var oldC = $('.confetti'); if (oldC) oldC.remove();
  var html = '', cu = cur();
  if (view === 'summary') html = screenSummary();
  else if (view === 'help') html = screenHelp();
  else if (view === 'join') html = screenJoin();
  else if (view === 'iab' && IAB) html = screenIab();
  else if (view === 'flow' && cu) {
    if (cu.step === 'follow') html = screenFollow();
    else if (cu.step === 'member') html = screenMember();
    else if (cu.step === 'reveal') html = screenReveal();
    else if (cu.step === 'drop') html = screenDrop();
    else if (cu.step === 'question') { html = screenQuestion(); answerLockUntil = Date.now() + 350; }
    else html = screenResult();
  } else { view = 'home'; html = screenHome(); }
  $('#app').innerHTML = html;
  if (view === 'flow' && cu && cu.step === 'drop') {
    dropTimer = setTimeout(function () { if (cur() && cur().step === 'drop') { cur().step = 'question'; freshQ = true; save(); lock(); render(); } }, REDUCED ? 350 : CONFIG.dropMs);
  }
  var main = $('.main'); if (main) main.scrollTop = 0;
}
/* update live numbers in place (no full re-render, so nothing jumps and typing is not interrupted) */
function liveUpdate() {
  try {
    var sr = $('#syncrow');
    if (sr) { var sp = syncParts(); sr.className = 'syncrow ' + sp.cls; sr.innerHTML = sp.html; }
    if (view === 'home') {
      var sc = $('#stockcard'); if (sc) sc.outerHTML = homeStock();
      var tl = $('#tallies'); if (tl) tl.innerHTML = homeTallies();
    } else if (view === 'summary') {
      var st = $('#stats'); if (st) st.innerHTML = statGrid();
      var ph = $('#phones'); if (ph) ph.innerHTML = phonesHtml();
      var t = totals(), a = $('#tfirst'), b = $('#tlast');
      if (a) a.textContent = t.first ? fmtTime(t.first) : 'none yet'; if (b) b.textContent = t.last ? fmtTime(t.last) : 'none yet';
      var sv = $('#stockv'); if (sv) sv.textContent = Math.max(0, remaining());
      var tv = $('#startv'); if (tv) tv.textContent = S.startStock;
    } else if (view === 'flow' && cur() && cur().step === 'result' && cur().ok && !serving) {
      var rb = $('#resbanner'), rf = $('#resfoot');
      if (rb) { var nb = resultBanner(); if (rb.innerHTML !== nb) rb.innerHTML = nb; }
      if (rf) {
        var nf = resultFoot(), sb = $('#servebtn');
        if (sb && nf.indexOf('id="servebtn"') >= 0) { var label = 'Serve food (' + remaining() + ' left)'; var tn = sb.lastChild; if (tn && tn.nodeType === 3 && tn.nodeValue !== label) tn.nodeValue = label; }
        else if (rf.innerHTML !== nf) rf.innerHTML = nf;
      }
    }
  } catch (e) {}
}
setInterval(function () { if (syncOn() && !modal) liveUpdate(); }, 2000);   // keeps "updated 4s ago" fresh

/* ---------- toast / modal / confetti ---------- */
function toast(msg) {
  clearTimeout(toastTimer);
  var t = $('#toast'); if (t) t.remove();
  var d = document.createElement('div'); d.className = 'toast'; d.id = 'toast'; d.setAttribute('role', 'status'); d.textContent = msg;
  document.body.appendChild(d);
  toastTimer = setTimeout(function () { d.remove(); }, 2600);
}
function showModal(html) { modal = true; $('#layer').innerHTML = '<div class="scrim" id="scrim"><div class="sheet" role="dialog" aria-modal="true">' + html + '</div></div>'; }
function closeModal() { modal = null; $('#layer').innerHTML = ''; }
function confetti() {
  if (REDUCED) return;
  var cols = ['#F5B800', '#C8001E', '#0A6B34', '#111111', '#FFFFFF'], h = '';
  for (var i = 0; i < 34; i++) {
    var x = Math.round((Math.random() - .5) * 360), y = 160 + Math.round(Math.random() * 360), r = Math.round((Math.random() - .5) * 900);
    h += '<i style="background:' + cols[i % cols.length] + ';--x:' + x + 'px;--y:' + y + 'px;--r:' + r + 'deg;animation-delay:' + (Math.random() * .15).toFixed(2) + 's' + (i % 5 === 4 ? ';outline:1px solid #111' : '') + '"></i>';
  }
  var d = document.createElement('div'); d.className = 'confetti'; d.setAttribute('aria-hidden', 'true'); d.innerHTML = h;
  document.body.appendChild(d); setTimeout(function () { d.remove(); }, 1700);
}

/* ---------- actions ---------- */
function newCustomer() {
  S.cur = { step: 'follow', follow: null, qid: null, attempt: 1, counted: false, picked: null, ok: false };
  save(); go('flow');
}
function endCustomer() { S.cur = null; serving = false; save(); go('home'); }
function askCancel() {
  showModal('<h3>Cancel this customer?</h3><p class="sub">Nothing will be counted for them.</p>' +
    '<button class="btn" data-act="cancel-yes">Cancel customer</button><button class="btn pri" data-act="modal-close">Keep going</button>');
}
function doReveal() { var cu = cur(); cu.qid = drawQuestion(); cu.step = 'drop'; save(); lock(); render(); }
function doSkip() {
  var cu = cur(); if (!cu || cu.step !== 'question') return;
  S.c.skips++; cu.qid = drawQuestion(); freshQ = true; commit(); lock(); render();
}
function doAnswer(k) {
  var cu = cur(); if (!cu || cu.step !== 'question' || Date.now() < answerLockUntil) return;
  var q = qById(cu.qid), now = Date.now(), c = S.c;
  if (!cu.counted) {
    cu.counted = true; c.customers++;
    if (cu.follow === 'already') c.already++; else c.follows++;
    if (cu.member === 'new') c.members++; else if (cu.member === 'already') c.memberAlready++;
    if (!S.first) S.first = now;
  }
  S.last = now;
  cu.picked = k; cu.ok = (k === q.answer);
  if (q.difficulty === 'easy') c.hot++; else c.full++;
  if (cu.ok) { c.correct++; c.won++; }
  else { c.wrong++; if (cu.attempt > CONFIG.retries) c.lost++; }
  cu.step = 'result'; commit(); lock(); render();
  if (cu.ok) { buzz(80); confetti(); } else buzz([120, 60, 120]);   // only from a real tap, so browsers allow the vibration
}
function doRetry() {
  var cu = cur(); cu.attempt++; S.c.retries++; cu.picked = null; cu.ok = false; cu.qid = drawQuestion(); cu.step = 'drop'; commit(); lock(); render();
}
async function doServe() {
  var cu = cur(); if (!cu || cu.step !== 'result' || !cu.ok || serving) return;
  serving = true;
  var btn = $('#servebtn'); if (btn) btn.disabled = true;
  /* near the end, check the team's latest count first so two phones cannot both hand out the last cups */
  if (syncOn() && syncState() === 'ok' && remaining() <= CONFIG.lowStock) { try { await Promise.race([pollNow(1500), new Promise(function (r) { setTimeout(r, 1600); })]); } catch (e) {} }
  if (cur() !== cu) { serving = false; return; }
  if (remaining() > 0) { S.c.served++; commit(); endCustomer(); }
  else { serving = false; toast('Sold out: another phone just served the last one'); render(); }
}
function endLost() { S.c.lost++; commit(); endCustomer(); }
function adjStock(d) {
  if (d < 0 && remaining() <= 0) return;
  S.adj = an(S.adj + d); commit(); liveUpdate();
}
async function copyText(t) {
  try { await navigator.clipboard.writeText(t); return true; } catch (e) {}
  try {
    var ta = document.createElement('textarea'); ta.value = t; ta.setAttribute('readonly', ''); ta.style.cssText = 'position:fixed;top:0;left:0;opacity:0';
    document.body.appendChild(ta); ta.select(); ta.setSelectionRange(0, t.length);
    var ok = document.execCommand('copy'); ta.remove(); return ok;
  } catch (e) { return false; }
}
async function doCopy() {
  var t = summaryText();
  if (await copyText(t)) toast('Summary copied');
  else showModal('<h3>Copy by hand</h3><p class="sub">Select all the text below and copy it.</p><textarea id="manual" readonly>' + esc(t) + '</textarea><button class="btn pri" data-act="modal-close">Close</button>');
}
function askReset() {
  if (!syncOn()) { localReset(); return; }
  var t = totals(), n = allRecs().length;
  showModal('<h3>Reset ALL phones?</h3><p class="sub">This clears ' + t.c.customers + ' customers and ' + t.c.served + ' food served across ' + n + ' phone' + (n === 1 ? '' : 's') + ', and puts food back to ' + S.startStock + '. Old numbers stay safe in the database.</p>' +
    '<button class="btn" data-act="reset-yes">Yes, reset all phones</button><button class="btn pri" data-act="modal-close">Keep my numbers</button>');
}
function submitJoin() {
  var code = parseTeam(($('#code') || {}).value || ''), err = $('#joinerr');
  if (!code) { if (err) { err.style.display = ''; err.textContent = 'That code does not look right. It has 8 letters and numbers, like ABCD-EFGH.'; } return; }
  doJoin(code);
}
function doJoin(code) {
  var go2 = function () { joinTeam(code); toast('Joined team ' + fmtTeam(code)); closeModal(); view = S.cur ? 'flow' : 'home'; render(); };
  if (code === S.team) { view = S.cur ? 'flow' : 'home'; render(); return; }
  if (hasTallies()) showModal('<h3>Join team ' + esc(fmtTeam(code)) + '?</h3><p class="sub">This phone\'s own tallies so far (' + S.c.customers + ' customers, ' + S.c.served + ' served) will be cleared so they are not mixed into the team count.</p>' +
    '<button class="btn" id="joinyes" data-act="join-yes" data-code="' + esc(code) + '">Join and clear this phone</button><button class="btn pri" data-act="modal-close">Cancel</button>');
  else go2();
}

/* ---------- events ---------- */
document.addEventListener('click', function (e) {
  var b = e.target.closest('[data-act]'); if (!b) return;
  if (Date.now() < lockUntil && b.dataset.act !== 'modal-close') return;
  var a = b.dataset.act, cu = cur();
  switch (a) {
    case 'next': newCustomer(); break;
    case 'summary': go('summary'); break;
    case 'help': go('help'); break;
    case 'sync-open': if (SYNC_URL && !S.team) go('join'); else if (view === 'home') go('summary'); else wakeSync(); break;
    case 'back-home':
      if (view === 'flow' && cu && cu.step === 'follow') { S.cur = null; save(); }
      go('home'); break;
    case 'follow-new': cu.follow = 'new'; cu.step = CONFIG.membershipUrl ? 'member' : 'reveal'; save(); go('flow'); break;
    case 'follow-already': cu.follow = 'already'; cu.step = CONFIG.membershipUrl ? 'member' : 'reveal'; save(); go('flow'); break;
    case 'member-new': cu.member = 'new'; cu.step = 'reveal'; save(); go('flow'); break;
    case 'member-already': cu.member = 'already'; cu.step = 'reveal'; save(); go('flow'); break;
    case 'cancel': askCancel(); break;
    case 'cancel-yes': closeModal(); endCustomer(); break;
    case 'modal-close': closeModal(); break;
    case 'reveal': doReveal(); break;
    case 'skip': doSkip(); break;
    case 'answer': doAnswer(b.dataset.k); break;
    case 'serve': doServe(); break;
    case 'retry': doRetry(); break;
    case 'end-lost': endLost(); break;
    case 'done': endCustomer(); break;
    case 'copy': doCopy(); break;
    case 'stock-': adjStock(-1); break;
    case 'stock+': adjStock(1); break;
    case 'start-': changeStart(-5); break;
    case 'start+': changeStart(5); break;
    case 'join-go': submitJoin(); break;
    case 'join-skip': S.skipJoin = true; save(); go('home'); break;
    case 'join-yes': { var code = b.dataset.code; joinTeam(code); toast('Joined team ' + fmtTeam(code)); closeModal(); view = S.cur ? 'flow' : 'home'; render(); break; }
    case 'change-team': go('join'); break;
    case 'share':
      showModal('<h3>Join this team</h3><div class="center" style="line-height:0">' + qrSvg(Math.min(window.innerWidth - 80, 260), joinLink(), 'qrjoin') + '</div><p class="sub center">Other volunteers scan this with their camera, or type the code<br><b style="font-size:26px;letter-spacing:.08em">' + esc(fmtTeam(S.team)) + '</b></p><button class="btn pri" data-act="modal-close">Close</button>'); break;
    case 'reset-yes': closeModal(); resetAll(); break;
    case 'iab-copy': (async function () {
      var link = location.origin + location.pathname + ((pendingCode || S.team) ? '#t=' + (pendingCode || S.team) : '');
      if (await copyText(link)) toast('Link copied. Paste it into ' + (IAB && IAB.os === 'ios' ? 'Safari' : 'Chrome'));
      else showModal('<h3>Copy by hand</h3><p class="sub">Select all the text below, copy it, and paste it into ' + (IAB && IAB.os === 'ios' ? 'Safari' : 'Chrome') + '.</p><textarea id="manual" readonly>' + esc(link) + '</textarea><button class="btn pri" data-act="modal-close">Close</button>');
    })(); break;
    case 'iab-continue': {
      iabAck = true; try { localStorage.setItem(IABKEY, '1'); } catch (e) {}
      var pc = pendingCode; pendingCode = '';
      if (addressHasCode()) stripCodeFromAddress();
      view = S.cur ? 'flow' : (SYNC_URL && !S.team && !S.skipJoin && !pc ? 'join' : 'home'); render(); applyJoinCode(pc); break; }
    case 'iab-open': toast('Opening your browser...'); iabHandoff(false); break;
    case 'iab-help': view = 'iab'; render(); break;
  }
});
document.addEventListener('input', function (e) {

try { history.replaceState({ g: 1 }, ''); history.pushState({ g: 2 }, ''); } catch (e) {}
window.addEventListener('popstate', function () {
  try { history.pushState({ g: 2 }, ''); } catch (e) {}
  var cu = cur();
  if (modal) closeModal();
  else if (view === 'summary' || view === 'help' || (view === 'join' && (S.team || S.skipJoin))) go('home');
  else if (view === 'flow' && cu && cu.step === 'follow') { S.cur = null; save(); go('home'); }
  else if (view === 'flow' && cu && !cu.counted && cu.step !== 'drop') askCancel();
});
var rz = null;
window.addEventListener('resize', function () { clearTimeout(rz); rz = setTimeout(function () { var cu = cur(); if (view === 'flow' && cu && cu.step === 'follow') render(); }, 200); });

/* The same app open twice on one phone (a browser tab and the installed app, or two tabs) shares one storage
   and one phone identity. When the other copy saves, adopt its state so the two copies mirror each other
   instead of overwriting each other. */
window.addEventListener('storage', function (e) {
  if (e.key !== KEY || !e.newValue) return;
  var prevCur = JSON.stringify(S.cur), prevTeam = S.team, next;
  try { next = normalise(JSON.parse(e.newValue)); } catch (err) { return; }
  if (next.id !== S.id) return;                       // a different phone identity: not ours to mirror
  S = next;
  if (S.team !== prevTeam) wakeSync();
  var typing = document.activeElement && /^(INPUT|TEXTAREA)$/.test(document.activeElement.tagName);
  if (JSON.stringify(S.cur) !== prevCur && !typing && !modal) { view = S.cur ? 'flow' : (view === 'flow' ? 'home' : view); render(); }
  else liveUpdate();
});

/* test and debugging hooks */
window.CC = { buildHandoff: buildHandoff, detectIab: detectIab, QUESTIONS: QUESTIONS, CONFIG: CONFIG, drawQuestion: drawQuestion, state: function () { return S; }, reset: resetAll,
  commit: commit, remaining: remaining, totals: totals, syncState: syncState, net: net, tick: tick, pollNow: pollNow, syncOn: syncOn, unsent: unsent };

/* join link: https://.../#t=ABCD-EFGH (the code never goes to the web host, it stays after the #).
   Handled at load AND whenever the address changes while the app is already open (for example a scanned QR). */
var started = false;
function applyJoinCode(code) {
  if (!(code && SYNC_URL && code !== S.team)) return;
  if (hasTallies()) { setTimeout(function () { doJoin(code); }, 300); return; }
  joinTeam(code);
  if (started) { toast('Joined team ' + fmtTeam(code)); view = S.cur ? 'flow' : 'home'; render(); }
}
/* The team code normally travels after the # (it never reaches the web host). If a chat app or link wrapper drops the #part,
   the same code is also accepted as ?t=CODE, which survives any link rewriting. Either way it is removed from the address once used. */
function codeFromAddress() { return parseTeam(location.hash || '') || parseTeam(location.search || ''); }
function addressHasCode() { return !!location.hash || /[?&]t(eam)?=/i.test(location.search); }
function stripCodeFromAddress() {
  try {
    var q = (location.search || '').replace(/^\?/, '').split('&').filter(function (kv) { return kv && !/^t(eam)?=/i.test(kv); }).join('&');
    history.replaceState(null, '', location.pathname + (q ? '?' + q : ''));
  } catch (e) {}
}
function handleHash() {
  var code = codeFromAddress();
  if (iabBlocking()) {                      // inside Instagram and friends: do not join here, send the volunteer to Safari or Chrome first
    if (code) { pendingCode = code; if (started) { view = 'iab'; render(); } }
    return;                                 // the address (with the code) is kept so Copy link still has it
  }
  if (addressHasCode()) stripCodeFromAddress();
  applyJoinCode(code);
}
window.addEventListener('hashchange', handleHash);
handleHash();
if (iabBlocking() && !S.cur) view = 'iab';
else if (SYNC_URL && !S.team && !S.skipJoin && !S.cur) view = 'join';
render();
started = true;
iabAutoTry();
wakeSync();
})();
</script>
